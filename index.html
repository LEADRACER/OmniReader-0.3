<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniReader</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6e45e2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="nebula-bg"></div>
  <main class="app-container glass" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="main-content">
      <header class="toolbar glass-nav" id="toolbar"></header>
      <div class="reader-viewport glass" id="reader"></div>
    </section>
  </main>
  <div class="modal-overlay hidden" id="uploadModal"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
